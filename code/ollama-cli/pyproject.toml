[project]
name = "ollama-basics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama==0.6.2",
    "python-dotenv>=1.2.2",
]

# entry-point table: maps commands to functions
[project.scripts]                    
mycli = "mycli:main"                 

[build-system]                       
# build dependency: the hatchling backend
requires = ["hatchling"]             
build-backend = "hatchling.build"    

[tool.hatch.build.targets.wheel]     
include = ["mycli.py", "config.py"]  
